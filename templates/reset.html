{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Reset Password</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'reset_success' else 'error' }}" style="background:{{ '#d1fae5' if category == 'reset_success' else '#fee2e2' }};color:{{ '#065f46' if category == 'reset_success' else '#991b1b' }};border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:0.9rem;font-weight:600;">
                    {{ '✅' if category == 'reset_success' else '⚠️' }} {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('reset_password') }}" method="POST" autocomplete="off">
            <input type="text" style="display:none" name="fake_usernameremembered" tabindex="-1">
            <input type="password" style="display:none" name="fake_passwordremembered" tabindex="-1">
            <div class="form-group">
                <label>Username (ชื่อผู้ใช้)</label>
                <input type="text" name="username" placeholder="Your username" required autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
            </div>
            
            <div class="form-group">
                <label>New Password (รหัสผ่านใหม่)</label>
                <div class="password-field">
                    <input type="password" name="new_password" id="new_password" placeholder="New password (min 4 chars)" required autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
                    <span class="password-toggle" onclick="togglePassword('new_password')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password (ยืนยันรหัสผ่าน)</label>
                <input type="password" name="confirm_password" placeholder="Confirm new password" required autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 0.95rem; outline: none; box-sizing: border-box; font-family: inherit;">
            </div>

            <script>
                function togglePassword(inputId) {
                    const input = document.getElementById(inputId);
                    const toggle = input.nextElementSibling;
                    const openEye = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                    const closedEye = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        toggle.innerHTML = closedEye;
                    } else {
                        input.type = 'password';
                        toggle.innerHTML = openEye;
                    }
                }
            </script>
            <button type="submit" class="submit-btn" style="margin-top: 10px;">Reset Password</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Back to <a href="{{ url_for('login') }}" style="color: var(--deep-pink); text-decoration: none; font-weight: 600;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
