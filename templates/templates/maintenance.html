<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | Aden ticket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            background: linear-gradient(135deg, var(--soft-pink) 0%, #fff 100%);
        }
        .maintenance-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 4rem 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 182, 193, 0.2);
            border: 2px solid var(--primary-pink);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }
        .maintenance-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        h1 {
            color: var(--deep-pink);
            margin-bottom: 1.5rem;
            font-size: 2.2rem;
            font-weight: 800;
        }
        p {
            color: var(--text-color);
            font-size: 1.2rem;
            line-height: 1.8;
            font-weight: 500;
        }
        .footer-text {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="maintenance-icon">🛠️</div>
        <h1>ขออภัยในความไม่สะดวก</h1>
        <p>
            ขณะนี้เว็บไซต์กำลังปิดปรับปรุง<br>
            จะเปิดให้ใช้บริการโดยเร็วที่สุด<br>
            ขออภัยในความไม่สะดวก ขอบคุณค่ะ
        </p>
        <div class="footer-text">
            &copy; 2026 Aden ticket. All rights reserved.
        </div>
    </div>
</body>
</html>
